<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><title>MyProgress</title><style>
:root{--b:#2563eb;--bg:#f5f7fb;--c:#fff;--t:#101828;--m:#667085;--l:#e4e7ec;--r:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{max-width:900px;margin:auto;min-height:100vh;padding-bottom:80px}header{position:sticky;top:0;z-index:5;background:#f5f7fbf2;backdrop-filter:blur(10px);padding:15px 16px 8px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:800}.lang{background:#fff;border:1px solid var(--l);border-radius:12px;padding:8px 12px;font-weight:700}main{padding:8px 15px}.view{display:none}.view.active{display:block}.hello{color:var(--m);margin:8px 0 2px}.title{font-size:28px;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card,.item{background:var(--c);border:1px solid var(--l);border-radius:var(--r);padding:15px}.big{font-size:27px;font-weight:800}.muted{color:var(--m);font-size:13px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.btn{background:var(--b);color:#fff;border:0;border-radius:12px;padding:11px 14px;font-weight:700}.secondary{background:#eef4ff;color:#1d4ed8}.danger{background:#fff0ef;color:#b42318}.ghost{background:#fff;color:var(--t);border:1px solid var(--l)}input,select,textarea{width:100%;padding:11px;border:1px solid var(--l);border-radius:12px;background:#fff;font:inherit}label{display:block;font-size:13px;font-weight:700;margin:10px 0 6px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.list{display:flex;flex-direction:column;gap:8px}.pill{padding:5px 9px;border-radius:99px;background:#eef4ff;color:#1d4ed8;font-size:12px;font-weight:700}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--l);z-index:10}.navin{max-width:900px;margin:auto;display:flex;overflow:auto}.nav button{flex:1;min-width:70px;background:none;color:var(--m);padding:8px 4px;border:0;font-size:11px}.nav button.active{color:var(--b);font-weight:800}.ico{display:block;font-size:18px;margin-bottom:2px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px;max-width:900px;margin:auto}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}canvas{width:100%;height:230px;background:#fff;border:1px solid var(--l);border-radius:14px}.empty{text-align:center;color:var(--m);padding:25px}hr{border:0;border-top:1px solid var(--l);margin:15px 0}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}} </style></head><body><div class="app"><header><div class="brand">MyProgress</div><button class="lang" id="langBtn">LT</button></header><main>
<section id="dashboard" class="view active"></section><section id="weight" class="view"></section><section id="measurements" class="view"></section><section id="workouts" class="view"></section><section id="progress" class="view"></section><section id="photos" class="view"></section><section id="nutrition" class="view"></section><section id="goals" class="view"></section><section id="settings" class="view"></section>
</main></div><nav class="nav"><div class="navin" id="nav"></div></nav><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><script src="app.js?v=3"></script></body></html>
