<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4d6ff2" />
  <meta name="description" content="MyProgress – fitness progress tracker" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <title>MyProgress</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">M</div><div><strong>MyProgress</strong><small data-i18n="appSubtitle">Your fitness journey</small></div></div>
      <button id="langBtn" class="lang-btn" aria-label="Change language">LT</button>
    </header>

    <main id="screen" class="screen"></main>

    <nav id="bottomNav" class="bottom-nav" aria-label="Main navigation">
      <button data-route="dashboard">⌂<span data-i18n="navHome">Home</span></button>
      <button data-route="weight">⚖<span data-i18n="navWeight">Weight</span></button>
      <button data-route="workouts">▣<span data-i18n="navWorkouts">Workouts</span></button>
      <button data-route="progress">↗<span data-i18n="navProgress">Progress</span></button>
      <button data-route="settings">⚙<span data-i18n="navSettings">Settings</span></button>
    </nav>
  </div>

  <div id="modal" class="modal hidden"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm" type="module"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
